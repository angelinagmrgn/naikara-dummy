<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Masuk — NAIKARA</title>
  <link rel="icon" type="image/png" href="./assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background-color: #FFFFFF; color: #1A202C; }
    .btn-naika-gold { background-color: #F2B732; color: #1A202C; border-bottom: 4px solid #C78E12; transition: all 0.15s ease; }
  </style>
</head>
<body class="min-h-screen bg-white flex flex-col justify-between antialiased">
  <header class="bg-white border-b border-slate-100 px-4 sm:px-8 h-20 flex items-center justify-between max-w-6xl w-full mx-auto">
    <a href="./index.html"><img src="./assets/logo.png" alt="NAIKARA" class="h-10 w-auto object-contain" /></a>
    <a href="./index.html" class="text-xs sm:text-sm font-extrabold text-slate-600">← Kembali</a>
  </header>
  <main class="flex-1 flex items-center justify-center px-4 py-10 bg-white">
    <div class="w-full max-w-md bg-white rounded-[2rem] border border-slate-200 p-8 space-y-6">
      <div class="text-center space-y-2">
        <img src="./assets/mascot-login.png" alt="Naika" class="w-16 h-16 mx-auto object-contain" />
        <h1 class="text-2xl font-extrabold text-slate-900">Selamat datang kembali</h1>
      </div>
      <form onsubmit="event.preventDefault(); window.location.href='./beranda.html';" class="space-y-4">
        <input type="email" required placeholder="nama@email.com" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm" />
        <input type="password" required placeholder="••••••••" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm" />
        <button type="submit" class="btn-naika-gold w-full py-3.5 rounded-full text-sm font-extrabold">Masuk ke Dashboard</button>
      </form>
    </div>
  </main>
</body>
</html>
